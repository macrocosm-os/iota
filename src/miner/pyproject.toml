[project]
name = "miner"
version = "0.1.0"
description = "IOTA Miner"
authors = [{ name = "Macrocosmos.ai" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "common",
  "subnet",
  "mc-iota-sdk>=0.1.0",
  "textual>=0.74.0",
  "speedtest-cli>=2.1.3",
  "blessed>=1.23.0",
  "platformdirs>=4.5.0",
  "prometheus_client>=0.20.0",
  "httpx>=0.27.0",
  "jsonpatch>=1.33",
  "nvidia-ml-py>=12.560.30",
]

[tool.uv]
dev-dependencies = ["pyinstaller>=6.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
common = { workspace = true }
subnet = { workspace = true }
